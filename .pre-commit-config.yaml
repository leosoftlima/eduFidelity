# Fast gates before every commit. The full set runs with: uv run python scripts/check.py
repos:
  - repo: local
    hooks:
      - id: repo-guard
        name: repository guard
        entry: uv run python scripts/repo_guard.py
        language: system
        pass_filenames: true
      - id: ruff
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy src
        language: system
        pass_filenames: false
        files: ^src/
