[project]
name = "edufidelity"
version = "0.1.0.dev0"
description = "Salience-aware, human-calibrated evaluation of LLM-generated e-learning interfaces (work in progress)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pillow>=10",
    "pydantic>=2.6",
    "rapidfuzz>=3.6",
    "playwright>=1.48",
]

[project.optional-dependencies]
# UIClip similarity: a 600 MB checkpoint, downloaded on first use.
uiclip = [
    "torch>=2.2",
    "transformers>=4.40",
]

[project.scripts]
edufidelity = "edufidelity.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edufidelity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: needs a Playwright Chromium install",
    "uiclip: needs the uiclip extra and downloads the checkpoint",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["skimage.*", "scipy.*", "rapidfuzz.*", "torch.*", "transformers.*"]
ignore_missing_imports = true
