<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check your understanding</title>
<style>
  @font-face { font-family: "EduSans"; src: url("../fonts/DejaVuSans.ttf"); font-weight: 400; }
  @font-face { font-family: "EduSans"; src: url("../fonts/DejaVuSans-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "EduSerif"; src: url("../fonts/DejaVuSerif.ttf"); font-weight: 400; }
  @font-face { font-family: "EduSerif"; src: url("../fonts/DejaVuSerif-Bold.ttf"); font-weight: 700; }
  body { margin: 0; font-family: "EduSans", sans-serif; color: #1f2933; background: #ffffff; }
  header { display: flex; align-items: center; gap: 16px; padding: 20px 64px; border-bottom: 1px solid #d9e2ec; }
  header .course { font-size: 18px; font-weight: bold; }
  header .progress { margin-left: auto; font-size: 14px; color: #52606d; }
  main { padding: 40px 64px; max-width: 820px; }
  h1 { font-size: 30px; margin: 0 0 12px; }
  .question { font-size: 20px; line-height: 1.5; margin: 0 0 24px; }
  .options { display: flex; flex-direction: column; gap: 14px; margin-bottom: 28px; }
  .option { display: flex; align-items: center; gap: 12px; }
  .option input { width: 20px; height: 20px; margin: 0; }
  .option span { font-size: 18px; }
  .hint { font-size: 15px; color: #52606d; width: 460px; margin-bottom: 28px; }
  .actions { display: flex; align-items: center; gap: 20px; }
  button { font-size: 16px; padding: 12px 28px; background: #2f855a; color: #ffffff; border: 0; border-radius: 6px; }
  button, input, select, textarea { font-family: inherit; }
</style>
</head>
<body>
<header>
  <svg data-ref-id="logo" data-salience="decorative" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="18" fill="#2f855a"/><path d="M12 24c4-10 12-10 16-4-6 0-10 2-16 4z" fill="#ffffff"/>
  </svg>
  <span class="course" data-ref-id="course-name" data-salience="supporting">Urban Composting Basics</span>
  <span class="progress" data-ref-id="progress" data-salience="supporting">Question 1 of 3</span>
</header>
<main>
  <h1 data-ref-id="title" data-salience="supporting">Check your understanding</h1>
  <p class="question" data-ref-id="question" data-salience="essential">Your compost pile smells sour and looks wet. Which material should you add?</p>
  <div class="options">
    <div class="option">
      <input type="radio" name="answer" aria-label="Fresh grass clippings" data-ref-id="option-a-input" data-salience="essential">
      <span data-ref-id="option-a" data-salience="essential">Fresh grass clippings</span>
    </div>
    <div class="option">
      <input type="radio" name="answer" aria-label="Dry leaves or shredded cardboard" data-ref-id="option-b-input" data-salience="essential">
      <span data-ref-id="option-b" data-salience="essential">Dry leaves or shredded cardboard</span>
    </div>
    <div class="option">
      <input type="radio" name="answer" aria-label="More vegetable scraps" data-ref-id="option-c-input" data-salience="essential">
      <span data-ref-id="option-c" data-salience="essential">More vegetable scraps</span>
    </div>
  </div>
  <p class="hint" data-ref-id="hint" data-salience="supporting">Hint: think about which group of materials is dry and rich in carbon.</p>
  <div class="actions">
    <button type="button" data-ref-id="submit" data-salience="essential">Submit answer</button>
    <svg data-ref-id="leaf" data-salience="decorative" width="48" height="48" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M8 40C8 16 24 8 40 8c0 20-10 32-32 32z" fill="#9ae6b4"/><path d="M8 40L30 18" stroke="#2f855a" stroke-width="2"/>
    </svg>
  </div>
</main>
</body>
</html>
